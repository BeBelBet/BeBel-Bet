<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Palpites Futebol — App Profissional</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
body {margin:0; font-family:'Roboto',sans-serif; background:#121212; color:#fff;}
/* Login */
#login-container{display:flex; justify-content:center; align-items:center; height:100vh;}
#login-box{background-color:#222; padding:40px 30px; border-radius:15px; width:90%; max-width:400px; box-shadow:0 0 20px rgba(0,255,0,0.3); text-align:center;}
#login-box h2{margin-bottom:20px; color:#4caf50;}
input{width:80%; padding:12px; margin:10px 0; border-radius:8px; border:none; font-size:16px;}
button{padding:12px 25px; margin-top:10px; border:none; border-radius:8px; background-color:#4caf50; color:#fff; font-size:16px; cursor:pointer;}
.error{color:#ff5555; margin-top:10px;}
/* App */
#app-container{display:none; padding-bottom:50px;}
header{padding:20px; text-align:center; font-size:26px; background-color:#111; box-shadow:0 2px 5px #000;}
nav{display:flex; justify-content: space-around; background:#111; position: sticky; top:0; z-index:10;}
nav button{background:none; border:none; color:#bbb; font-size:16px; padding:15px; cursor:pointer; transition:0.3s;}
nav button.active{color:#4caf50; border-bottom:3px solid #4caf50;}
.tab{display:none; padding:20px;}
.tab.active{display:block;}
.match-card{padding:15px; margin-bottom:15px; border-radius:12px; display:flex; align-items:center; transition: transform 0.2s;}
.match-card:hover{transform:translateY(-5px);}
.team-logo{width:40px; height:40px; margin-right:10px; border-radius:50%; object-fit:cover;}
.match-info{flex:1;}
.teams{font-size:18px; font-weight:bold;}
.tip{margin-top:4px;}
/* Gradientes por tipo de aposta */
.tab1 .match-card{background:linear-gradient(90deg,#4caf50,#2e7d32);}
.tab2 .match-card{background:linear-gradient(90deg,#2196f3,#1565c0);}
.tab3 .match-card{background:linear-gradient(90deg,#f44336,#b71c1c);}
.tab4 .match-card{background:linear-gradient(90deg,#ffeb3b,#fbc02d); color:#000;}
@media(max-width:600px){.teams{font-size:16px;} nav button{font-size:14px; padding:10px;}}
</style>
</head>
<body>

<div id="login-container">
  <div id="login-box">
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Usuário"><br>
    <input type="password" id="password" placeholder="Senha"><br>
    <button onclick="login()">Entrar</button>
    <p class="error" id="error-msg"></p>
  </div>
</div>

<div id="app-container">
  <header>Palpites Futebol — App Profissional</header>
  <nav>
    <button id="tab1-btn" class="active">+1.5 Gols</button>
    <button id="tab2-btn">Ambas Marcam</button>
    <button id="tab3-btn">Vitória Seca</button>
    <button id="tab4-btn">Placar Exato</button>
  </nav>

  <!-- TAB +1.5 Gols -->
  <div id="tab1" class="tab tab1 active">
    <!-- Adicione seus 10 jogos +1.5 gols aqui -->
  </div>

  <!-- TAB Ambas Marcam -->
  <div id="tab2" class="tab tab2">
    <!-- Adicione seus 10 jogos Ambas Marcam aqui -->
  </div>

  <!-- TAB Vitória Seca -->
  <div id="tab3" class="tab tab3">
    <!-- Adicione seus 10 jogos Vitória Seca aqui -->
  </div>

  <!-- TAB Placar Exato -->
  <div id="tab4" class="tab tab4">
    <!-- Adicione seus 10 jogos Placar Exato aqui -->
  </div>
</div>

<script>
function login(){
  const user=document.getElementById('username').value;
  const pass=document.getElementById('password').value;
  const error=document.getElementById('error-msg');
  if(user==="kawan" && pass==="1234"){
    document.getElementById('login-container').style.display="none";
    document.getElementById('app-container').style.display="block";
  }else{error.textContent="Usuário ou senha incorretos!";}
}
const tabs=["tab1","tab2","tab3","tab4"];
tabs.forEach((t,i)=>{
  document.getElementById(`tab${i+1}-btn`).addEventListener("click",()=>{
    tabs.forEach((u,j)=>{
      document.getElementById(`tab${j+1}-btn`).classList.remove("active");
      document.getElementById(u).classList.remove("active");
    });
    document.getElementById(`tab${i+1}-btn`).classList.add("active");
    document.getElementById(t).classList.add("active");
  });
});
</script>

</body>
</html>
