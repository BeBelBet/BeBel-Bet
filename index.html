<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palpites Futebol — Pro App Interativo</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body {margin:0; font-family:'Roboto',sans-serif; background:#121212; color:#fff;}
header{padding:20px; text-align:center; font-size:26px; background-color:#111; box-shadow:0 2px 5px #000;}
nav{display:flex; justify-content: space-around; background:#111; position: sticky; top:0; z-index:10;}
nav button{background:none; border:none; color:#bbb; font-size:16px; padding:15px; cursor:pointer; transition:0.3s;}
nav button.active{color:#4caf50; border-bottom:3px solid #4caf50;}
.tab{display:none; padding:20px;}
.tab.active{display:block;}
.match-card{padding:15px; margin-bottom:15px; border-radius:12px; display:flex; align-items:center; transition: transform 0.3s, box-shadow 0.3s; background: linear-gradient(90deg,#222,#333);}
.match-card:hover{transform:translateY(-5px); box-shadow:0 5px 15px rgba(0,255,0,0.3);}
.team-logo{width:40px; height:40px; margin-right:10px; border-radius:50%; object-fit:cover;}
.match-info{flex:1;}
.teams{font-size:18px; font-weight:bold;}
.tip{margin-top:4px; color:#ccc;}
.chart-container{margin-top:20px; background:#1e1e1e; padding:15px; border-radius:12px; height:200px;}
.generate-btn{padding:10px 20px; margin:10px 0; border:none; border-radius:8px; background:#4caf50; color:#fff; cursor:pointer; font-size:16px; transition:0.3s;}
.generate-btn:hover{background:#45a049;}
@media(max-width:600px){.teams{font-size:16px;} nav button{font-size:14px; padding:10px;}}
</style>
</head>
<body>

<header>Palpites Futebol — Pro App Interativo</header>

<nav>
<button id="tab1-btn" class="active">+1.5 Gols</button>
<button id="tab2-btn">Ambas Marcam</button>
<button id="tab3-btn">Vitória Seca</button>
<button id="tab4-btn">Placar Exato</button>
</nav>

<!-- Abas -->
<div id="tab1" class="tab tab1 active">
  <button class="generate-btn" onclick="gerarPalpite('tab1')">Gerar Palpites +1.5 Gols</button>
  <div id="tab1-cards"></div>
  <div class="chart-container">
    <canvas id="chart1"></canvas>
  </div>
</div>

<div id="tab2" class="tab tab2">
  <button class="generate-btn" onclick="gerarPalpite('tab2')">Gerar Palpites Ambas Marcam</button>
  <div id="tab2-cards"></div>
  <div class="chart-container">
    <canvas id="chart2"></canvas>
  </div>
</div>

<div id="tab3" class="tab tab3">
  <button class="generate-btn" onclick="gerarPalpite('tab3')">Gerar Palpites Vitória Seca</button>
  <div id="tab3-cards"></div>
  <div class="chart-container">
    <canvas id="chart3"></canvas>
  </div>
</div>

<div id="tab4" class="tab tab4">
  <button class="generate-btn" onclick="gerarPalpite('tab4')">Gerar Palpites Placar Exato</button>
  <div id="tab4-cards"></div>
  <div class="chart-container">
    <canvas id="chart4"></canvas>
  </div>
</div>

<script>
// Abas
const tabs=["tab1","tab2","tab3","tab4"];
tabs.forEach((t,i)=>{
  document.getElementById(`tab${i+1}-btn`).addEventListener("click",()=>{
    tabs.forEach((u,j)=>{
      document.getElementById(`tab${j+1}-btn`).classList.remove("active");
      document.getElementById(u).classList.remove("active");
    });
    document.getElementById(`tab${i+1}-btn`).classList.add("active");
    document.getElementById(t).classList.add("active");
  });
});

// Dados simulados
const times=["Corinthians","Flamengo","Palmeiras","Atlético-MG","Vasco","Botafogo","Grêmio","Fluminense","Cruzeiro","Santos"];
const resultados={tab1: ["Over 1.5","Over 1.5","Over 2.5"], tab2:["Sim","Não"], tab3:["Vitória","Empate","Derrota"], tab4:["1-0","2-1","3-2"]};

// Gerar cards aleatórios
function gerarPalpite(tab){
  const container=document.getElementById(tab+'-cards');
  container.innerHTML="";
  for(let i=0;i<5;i++){
    const t1=times[Math.floor(Math.random()*times.length)];
    const t2=times[Math.floor(Math.random()*times.length)];
    const tip=resultados[tab][Math.floor(Math.random()*resultados[tab].length)];
    const card=document.createElement("div");
    card.className="match-card";
    card.innerHTML=`<img class="team-logo" src="https://via.placeholder.com/40" alt="${t1}">
      <div class="match-info">
      <span class="teams">${t1} vs ${t2}</span>
      <span class="tip">${tip}</span>
      </div>`;
    container.appendChild(card);
  }
  atualizarGrafico(tab);
}

// Gráficos
const chartInstances={};
function atualizarGrafico(tab){
  const ctx=document.getElementById('chart'+tab.slice(-1)).getContext('2d');
  const labels=resultados[tab];
  const data=labels.map(()=>Math.floor(Math.random()*50)+10);
  if(chartInstances[tab]){
    chartInstances[tab].data.datasets[0].data=data;
    chartInstances[tab].update();
  } else {
    chartInstances[tab]=new Chart(ctx,{
      type:'doughnut',
      data:{labels:labels,datasets:[{data:data, backgroundColor:labels.map((_,i)=>['#4caf50','#2196f3','#f44336','#ffeb3b'][i%4])}]},
      options:{plugins:{legend:{labels:{color:'#fff'}}}, responsive:true, maintainAspectRatio:false}
    });
  }
}

// Gerar palpites iniciais
tabs.forEach(tab=>gerarPalpite(tab));
</script>

</body>
</html>
